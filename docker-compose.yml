version: "3.8"

services:
  postgres:
    image: supabase/postgres:15.1.1.78
    container_name: scout_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ienc1Ayj2Qifhaff
      POSTGRES_DB: langgraph
    ports:
      - "5432:5432"
    volumes:
      - supabase_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d langgraph"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: scout_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  langgraph-api:
    build:
      context: .                  # Root directory so COPY instructions can see pyproject.toml & agent/
      dockerfile: agent/DOCKERFILE # Path pointing to agent/DOCKERFILE
    container_name: scout_agent_server
    restart: always
    ports:
      - "8123:8000"
    environment:
      DATABASE_URI: "postgres://postgres:ienc1Ayj2Qifhaff@postgres:5432/langgraph?sslmode=disable"
      REDIS_URI: "redis://redis:6379"
      GEMINI_API_KEY: "${GOOGLE_API_KEY}"
      LANGSMITH_API_KEY: "${LANGSMITH_API_KEY}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  supabase_db_data:
    driver: local