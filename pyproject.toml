[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scout-research"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "grandalf>=0.8",
    "ipython>=9.16.0",
    "langchain>=1.3.14",
    "langchain-core>=1.5.3",
    "langchain-google-genai>=4.3.2",
    "langchain-mcp-adapters>=0.1.0",
    "langgraph>=1.2.10",
    "langgraph-api>=0.11.2",
    "langgraph-cli>=0.4.31",
    "langgraph-sdk>=0.4.2",
    "markdown>=3.10.3",
    "mcp>=1.0.0,<2.0.0",
    "nest-asyncio>=1.6.0",
    "pillow>=12.3.0",
    "pybreaker>=1.4.1",
    "pydantic>=2.13.4",
    "pygraphviz>=2.0.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "streamlit>=1.60.0",
    "tavily>=1.1.0",
    "fpdf2>=2.7.9",
    "markdown2>=2.5.5",
    "xhtml2pdf>=0.2.17",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[tool.hatch.build.targets.wheel]
packages = ["agent", "backend", "frontend"]
